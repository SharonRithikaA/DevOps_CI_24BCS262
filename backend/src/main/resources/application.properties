spring.application.name=gym-membership-management-system
# Optional local .env file (KEY=VALUE lines) placed in the backend/ folder. See .env.example
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8080}

# ---- Database (MySQL) ----
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:gym_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:gym_user}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---- Security ----
# JWT_SECRET must be at least 32 characters. Never commit a real secret.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiry-hours=${JWT_EXPIRY_HOURS:8}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ---- Application ----
app.timezone=${APP_TIMEZONE:Asia/Kolkata}

# ---- Demo / sample data (set SEED_ENABLED=false to disable) ----
app.seed.enabled=${SEED_ENABLED:true}
app.seed.admin-password=${SEED_ADMIN_PASSWORD:Admin@123}
app.seed.staff-password=${SEED_STAFF_PASSWORD:Staff@123}
